# Linux / macOS: replace all paths and the actor before adding to your Codex config.
# Default mode requires a clean Git checkout with an upstream and performs pull/commit/push.
[mcp_servers.team_tasks]
command = "python3"
args = ["/absolute/path/task-manager/team_tasks.py", "--registry", "/absolute/path/team-work/registry", "--actor", "alice", "mcp"]

